<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue — Post Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* EasyPC house style: green #62B134, black #0b0b0b, white, Open Sans.
     Light by default, dark via the header toggle or the OS setting. */
  :root {
    --bg: #ffffff; --surface: #f5f6f4; --surface-2: #eaece7; --surface-3: #ffffff;
    --text: #0b0b0b; --text-muted: #5c6157;
    --accent: #62B134; --accent-ink: #0b0b0b;
    --accent-text: #2f6b12; /* green as text: plain #62B134 is too light on white */
    --negative: #a8321f; --warning: #8a5a00; --info: #1f5f96;
    --border: #d9dcd4; --border-soft: #b9bdb2;
    --fb: #1f5f96; --yt: #b3261e; --tt: #0b6b68;
    --shadow-med: 0 8px 8px rgba(0,0,0,0.12);
    --shadow-heavy: 0 8px 24px rgba(0,0,0,0.18);
    --font: 'Open Sans', Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --bg: #0b0b0b; --surface: #161616; --surface-2: #202020; --surface-3: #2a2a2a;
    --text: #ffffff; --text-muted: #a3a79d; --accent-text: #7ccb4e;
    --negative: #ff8f7d; --warning: #f0b84a; --info: #7fb8ea;
    --border: #333630; --border-soft: #5a5e55;
    --fb: #7fb8ea; --yt: #ff8f7d; --tt: #5fd6d1;
    --shadow-heavy: 0 8px 24px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0b; --surface: #161616; --surface-2: #202020; --surface-3: #2a2a2a;
    --text: #ffffff; --text-muted: #a3a79d; --accent-text: #7ccb4e;
    --negative: #ff8f7d; --warning: #f0b84a; --info: #7fb8ea;
    --border: #333630; --border-soft: #5a5e55;
    --fb: #7fb8ea; --yt: #ff8f7d; --tt: #5fd6d1;
    --shadow-heavy: 0 8px 24px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  * { scrollbar-color: var(--border-soft) transparent; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 999px; border: 2px solid var(--bg); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 20px; margin-bottom: 28px;
    flex-wrap: wrap; gap: 12px;
  }
  .mark { width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; flex-shrink: 0; }
  header.top h1 {
    font-size: 24px; font-weight: 700; letter-spacing: normal;
    margin: 0;
  }
  header.top h1 span { color: var(--accent-text); }
  .eyebrow { font-size: 12px; font-weight: 700; color: var(--text-muted); letter-spacing: normal; }

  .icon { width: 15px; height: 15px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .settings {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    background: var(--surface); border-radius: 8px;
    padding: 16px; margin-bottom: 20px;
  }
  .settings label { font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px; }
  .settings input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 9px 14px; font-family: var(--font); font-size: 13px;
  }
  .settings input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .connect-row { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
  .connect-btn {
    display: flex; align-items: center; gap: 8px;
    background: transparent; border: 1px solid var(--border-soft); border-radius: 8px;
    padding: 9px 16px; font-size: 14px; font-weight: 700; color: var(--text);
    cursor: pointer; font-family: var(--font);
  }
  .connect-btn:hover { border-color: var(--text); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .dot.live { background: var(--accent); }
  .tag-fb { color: var(--fb); } .tag-yt { color: var(--yt); } .tag-tt { color: var(--tt); }

  .layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 480px) {
    .settings { grid-template-columns: 1fr; }
    .ticket-body { flex-wrap: wrap; }
    .ticket-time { width: auto; }
    .media-row { flex-wrap: wrap; }
    .media-row > div:first-child { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .submit-btn:hover { transform: none; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
  }
  .panel h2 {
    font-size: 18px; font-weight: 600; line-height: 1.3;
    letter-spacing: normal; text-transform: none; color: var(--text); margin: 0 0 18px;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 7px; }
  .field select, .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 16px; font-family: var(--font); font-size: 14px;
  }
  .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 12px 14px; font-family: var(--font); font-size: 14px;
    min-height: 80px; resize: vertical;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; line-height: 1.5;
  }
  .field select:focus-visible, .field input:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .submit-btn {
    width: 100%; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px;
    padding: 13px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px;
    font-family: var(--font);
  }
  .submit-btn:hover { filter: brightness(1.08); transform: scale(1.02); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .tab-row { display: flex; align-items: center; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .collapsible-header {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .chevron { color: var(--text-muted); transition: transform 0.2s ease; }
  .chevron.collapsed { transform: rotate(-90deg); }
  .header-storage-pct { text-transform: none; letter-spacing: normal; font-size: 12px; font-weight: 400; }
  .header-storage-pct.warn { color: var(--warning); }
  .header-storage-pct.crit { color: var(--negative); }
  #mediaLibraryBody { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.25s ease; }
  #mediaLibraryBody.collapsed { grid-template-rows: 0fr; }
  .collapsible-inner { overflow: hidden; min-height: 0; padding-top: 12px; }
  .tab-btn {
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-family: var(--font); font-size: 14px; font-weight: 400;
    padding: 8px 14px; border-radius: 8px;
  }
  .tab-btn .count { font-weight: 400; opacity: 0.75; margin-left: 4px; }
  .tab-btn { border-bottom: 3px solid transparent; border-radius: 0; }
  .tab-btn.active { color: var(--text); font-weight: 700; border-bottom-color: var(--accent); }
  .tab-btn:not(.active):hover { color: var(--text); }

  .day-group { margin-bottom: 24px; }
  .day-label {
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; padding-left: 4px;
  }

  .ticket {
    display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 8px; overflow: hidden;
  }
  .ticket-body { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; flex: 1; min-width: 0; }
  .ticket-time { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; width: 52px; flex-shrink: 0; }
  .ticket-main { flex: 1; min-width: 0; }
  .ticket-platform { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
  .ticket-platform.facebook { color: var(--fb); }
  .ticket-platform.youtube { color: var(--yt); }
  .ticket-platform.tiktok { color: var(--tt); }
  .ticket-account { color: var(--text-muted); text-transform: none; letter-spacing: normal; font-weight: 400; }
  .ticket-caption { font-size: 14px; color: var(--text); white-space: normal; overflow-wrap: break-word; line-height: 1.5; }
  .ticket-error { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; color: var(--negative); margin-top: 6px; line-height: 1.4; overflow-wrap: break-word; }
  .ticket-error .icon { width: 13px; height: 13px; margin-top: 2px; }
  .ticket-view-link { display: inline-block; margin-top: 6px; font-size: 12px; color: var(--accent-text); text-decoration: none; font-weight: 700; }
  .ticket-view-link:hover { text-decoration: underline; }

  .status-badge { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; text-transform: capitalize; padding: 5px 10px; border-radius: 999px; flex-shrink: 0; }
  .status-pending { background: rgba(255,164,43,0.16); color: var(--warning); }
  .status-processing { background: rgba(83,157,245,0.16); color: var(--info); }
  .status-uploading { background: rgba(83,157,245,0.16); color: var(--info); }
  .status-fb_reel_processing { background: rgba(83,157,245,0.16); color: var(--info); }
  .status-posted { background: rgba(98,177,52,0.16); color: var(--accent-text); }
  .status-failed { background: rgba(243,114,127,0.16); color: var(--negative); }
  .led { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-processing .led, .status-uploading .led, .status-fb_reel_processing .led { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  .cancel-btn {
    background: var(--surface-2); border: 1px solid transparent; color: var(--text-muted); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: 8px; flex-shrink: 0;
    font-family: var(--font);
  }
  .checklist-row { display: flex; align-items: center; gap: 8px; padding: 6px 2px; font-size: 14px; }
  .checklist-row input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--accent); }
  .checklist-row label { cursor: pointer; margin: 0; font-size: 14px; color: var(--text); }
  .cancel-btn:hover { color: var(--negative); }
  .retry-btn { color: var(--text); }
  .retry-btn:hover { color: var(--accent-text); }

  .thumb-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb-options .cancel-btn, .thumb-actions .cancel-btn { margin-left: 0; }
  .thumb-options label.cancel-btn { display: inline-block; margin-bottom: 0; font-size: 12px; color: var(--text); }
  #frameVideo { display: block; width: 100%; max-height: 280px; background: #000; border-radius: 8px; margin-top: 10px; }
  #frameSlider { width: 100%; margin-top: 8px; accent-color: var(--accent); padding: 0; background: transparent; }
  #thumbImg { display: block; max-width: 100%; max-height: 160px; border-radius: 8px; margin-top: 10px; }
  .thumb-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .thumb-note { font-size: 12px; color: var(--text-muted); }
  .thumb-actions .thumb-note { flex: 1; min-width: 80px; }
  .ticket-thumb-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  .reschedule-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-top: 10px; }
  .reschedule-row .field { margin-bottom: 0; flex: 1; min-width: 130px; }
  .reschedule-row .field label { font-size: 12px; margin-bottom: 4px; }
  .reschedule-row .field input { padding: 7px 12px; font-size: 13px; }
  .reschedule-row .cancel-btn { margin-left: 0; }
  .reschedule-siblings { width: 100%; margin-top: 4px; }
  .reschedule-siblings-title { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .reschedule-siblings .checklist-row { padding: 3px 2px; }
  .reschedule-siblings .checklist-row label { font-size: 13px; }

  .clear-all-btn {
    background: transparent; border: 1px solid var(--border-soft); color: var(--text-muted); border-radius: 8px;
    padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: auto; align-self: center;
    font-family: var(--font);
  }
  .clear-all-btn:hover { border-color: var(--negative); color: var(--negative); }

  .media-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--surface-2); font-size: 13px;
  }
  .media-row:last-child { border-bottom: none; }
  .media-name { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .media-empty { color: var(--text-muted); font-size: 13px; padding: 6px 0; }
  .media-size { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 12px; flex-shrink: 0; }

  .storage-meter { margin-bottom: 14px; }
  .storage-meter-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .storage-meter-label { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .storage-meter-track { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .storage-meter-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }
  .storage-meter-fill.warn { background: var(--warning); }
  .storage-meter-fill.crit { background: var(--negative); }
  .storage-banner {
    display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px 14px;
    border-radius: 8px; margin-bottom: 14px; color: var(--warning);
    background: rgba(255,164,43,0.12);
  }
  .storage-banner.crit { color: var(--negative); background: rgba(243,114,127,0.12); }

  .empty { color: var(--text-muted); font-size: 14px; padding: 36px 0; text-align: center; }

  #toastStack {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    z-index: 10; max-width: calc(100vw - 32px);
  }
  .toast {
    border: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-3); border-radius: 8px;
    padding: 12px 18px; font-size: 14px; box-shadow: var(--shadow-heavy);
  }
  .toast.error { color: var(--negative); }
  .toast.success { color: var(--accent-text); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="mark">PC</div>
      <div>
        <h1 onclick="handleTitleTap()" style="cursor:default;user-select:none;">Post <span>Queue</span></h1>
        <div class="eyebrow">Facebook, YouTube and TikTok in one queue</div>
      </div>
    </div>
    <button class="connect-btn" onclick="toggleSettings()" id="settingsToggle" style="display:none;">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </header>

  <div class="settings" id="settingsPanel" style="display:none;">
    <div>
      <label for="workerUrl">Worker base URL</label>
      <input id="workerUrl" placeholder="https://post-scheduler.your-subdomain.workers.dev" value="https://post-scheduler.tammy-padal.workers.dev">
    </div>
    <div>
      <label for="apiToken">API token</label>
      <input id="apiToken" type="password" placeholder="Your API_AUTH_TOKEN">
    </div>
  </div>

  <div class="connect-row">
    <button class="connect-btn" onclick="toggleTheme()" aria-label="Switch light or dark" style="margin-left:auto;order:9;">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      Theme
    </button>
    <button class="connect-btn" onclick="connect('facebook')"><span class="dot" id="dot-facebook"></span><span class="tag-fb">Connect Facebook</span></button>
    <button class="connect-btn" onclick="connect('youtube')"><span class="dot" id="dot-youtube"></span><span class="tag-yt">Connect YouTube</span></button>
    <button class="connect-btn" onclick="connect('tiktok')"><span class="dot" id="dot-tiktok"></span><span class="tag-tt">Connect TikTok</span></button>
    <button class="connect-btn" onclick="loadAll()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>Schedule a post</h2>
      <div class="field">
        <label>1 · Where to post (pick one or more)</label>
        <div id="accountChecklist" style="max-height:180px;overflow-y:auto;border-radius:8px;padding:8px;background:var(--surface-2);"></div>
      </div>
      <div class="field">
        <label for="caption">2 · Caption</label>
        <textarea id="caption" placeholder="Write your caption..."></textarea>
      </div>
      <div class="field">
        <label for="mediaFile">3 · Media file (image or video)</label>
        <input id="mediaFile" type="file" accept="image/*,video/*">
        <div id="uploadStatus" style="font-size:12px;color:var(--text-muted);margin-top:6px;"></div>
      </div>
      <div class="field">
        <label for="mediaUrl">Media URL (auto-filled after upload, or paste your own)</label>
        <input id="mediaUrl" placeholder="https://...">
      </div>
      <div class="field">
        <label for="mediaType">Media type</label>
        <select id="mediaType">
          <option value="none">None (text only)</option>
          <option value="image">Image</option>
          <option value="video">Video</option>
        </select>
      </div>
      <div class="field" id="thumbnailField" style="display:none;">
        <label>Thumbnail (optional; the platform default is used if none)</label>
        <div class="thumb-options" id="thumbOptions">
          <button type="button" class="cancel-btn retry-btn" onclick="openFramePicker()">Pick a frame from the video</button>
          <label class="cancel-btn retry-btn" for="thumbFile">Upload an image</label>
          <input id="thumbFile" type="file" accept="image/jpeg,image/png" hidden>
        </div>
        <div id="framePicker" style="display:none;">
          <video id="frameVideo" muted playsinline preload="auto"></video>
          <input id="frameSlider" type="range" min="0" step="0.05" value="0" aria-label="Video frame">
          <div class="thumb-actions">
            <span id="frameTime" class="thumb-note">0:00</span>
            <button type="button" class="cancel-btn retry-btn" onclick="useCurrentFrame()">Use this frame</button>
            <button type="button" class="cancel-btn" onclick="closeFramePicker()">Cancel</button>
          </div>
        </div>
        <div id="thumbPreview" style="display:none;">
          <img id="thumbImg" alt="Selected thumbnail">
          <div class="thumb-actions">
            <span id="thumbSource" class="thumb-note"></span>
            <button type="button" class="cancel-btn" onclick="clearThumbnail()">Remove</button>
          </div>
        </div>
        <div id="thumbStatus" class="thumb-note"></div>
      </div>
      <div class="field">
        <div class="checklist-row" style="padding:0 0 10px 0;">
          <input type="checkbox" id="postNow">
          <label for="postNow">4 · Post now (skip schedule)</label>
        </div>
      </div>
      <div class="field-row" id="dateTimeRow">
        <div class="field">
          <label for="postDate">Date</label>
          <input id="postDate" type="date">
        </div>
        <div class="field">
          <label for="postTime">Time</label>
          <input id="postTime" type="time">
        </div>
      </div>
      <button class="submit-btn" onclick="schedulePost()">Add to queue</button>
    </div>

    <div>
      <div class="panel" style="margin-bottom:20px;">
        <h2 class="collapsible-header" id="mediaLibraryHeader" role="button" tabindex="0" aria-expanded="true" aria-controls="mediaLibraryBody" onclick="toggleMediaLibrary()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleMediaLibrary();}">
          <span>Media library <span class="header-storage-pct" id="headerStoragePct"></span></span>
          <svg class="icon chevron" id="mediaLibraryChevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </h2>
        <div id="mediaLibraryBody">
          <div class="collapsible-inner">
            <div id="storageMeter"></div>
            <div id="mediaLibrary"></div>
          </div>
        </div>
      </div>
      <div class="tab-row">
        <button class="tab-btn active" id="tab-queue" onclick="switchTab('queue')">Queue<span class="count" id="count-queue"></span></button>
        <button class="tab-btn" id="tab-failed" onclick="switchTab('failed')">Failed<span class="count" id="count-failed"></span></button>
        <button class="tab-btn" id="tab-posted" onclick="switchTab('posted')">Posted<span class="count" id="count-posted"></span></button>
        <button class="clear-all-btn" id="clearAllFailedBtn" onclick="clearAllFailed()" style="display:none">Clear all failed</button>
      </div>
      <div id="queueContainer"></div>
    </div>
  </div>
</div>

<script>
let accounts = [];
let posts = [];
let activeTab = 'queue';
let storageWarned = false;

// Must match MAX_REEL_WAIT_TICKS in src/platforms/facebook.js — used only to
// show a rough "how close to timeout" percentage, not actual Meta transcode progress.
const FB_REEL_MAX_TICKS = 60;

// Cloudflare R2 free tier is 10 GB — adjust if you're on a paid plan / bigger bucket.
const STORAGE_LIMIT_BYTES = 10 * 1024 * 1024 * 1024;

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return `${(bytes / Math.pow(1024, i)).toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

// Light/dark: follows the OS until the button is used, then remembered here.
function toggleTheme() {
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  r.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
}
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ignore */ }

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'grid' : 'none';
}

// Hidden unlock: Settings stays out of sight until someone taps the "Post
// Queue" title 6 times in a row (resets if more than 2s passes between
// taps). Once unlocked on this device, stays unlocked (localStorage) so the
// operator doesn't have to repeat the tap dance every visit.
const TITLE_TAP_TARGET = 6;
const TITLE_TAP_WINDOW_MS = 2000;
let titleTapCount = 0;
let titleTapResetTimer = null;

function unlockSettings(silent) {
  document.getElementById('settingsToggle').style.display = 'flex';
  try { localStorage.setItem('settingsUnlocked', '1'); } catch (e) { /* ignore */ }
  if (!silent) showToast('Settings unlocked.', 'success');
}

function handleTitleTap() {
  titleTapCount++;
  clearTimeout(titleTapResetTimer);
  titleTapResetTimer = setTimeout(() => { titleTapCount = 0; }, TITLE_TAP_WINDOW_MS);
  if (titleTapCount >= TITLE_TAP_TARGET) {
    titleTapCount = 0;
    unlockSettings(false);
  }
}

(function restoreSettingsUnlock() {
  try {
    if (localStorage.getItem('settingsUnlocked') === '1') unlockSettings(true);
  } catch (e) { /* ignore */ }
})();

function toggleMediaLibrary() {
  const body = document.getElementById('mediaLibraryBody');
  const chevron = document.getElementById('mediaLibraryChevron');
  const collapsed = body.classList.toggle('collapsed');
  chevron.classList.toggle('collapsed', collapsed);
  document.getElementById('mediaLibraryHeader').setAttribute('aria-expanded', String(!collapsed));
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-queue').classList.toggle('active', tab === 'queue');
  document.getElementById('tab-failed').classList.toggle('active', tab === 'failed');
  document.getElementById('tab-posted').classList.toggle('active', tab === 'posted');
  renderQueue();
}

// Worker URL + API token are kept in this browser's own localStorage only —
// never baked into the HTML file itself (that file is what gets deployed
// publicly), so pasting once per device is enough without shipping the
// token to whoever loads the public page.
function getConfig() {
  const base = document.getElementById('workerUrl').value.replace(/\/$/, '');
  const token = document.getElementById('apiToken').value;
  try {
    localStorage.setItem('workerUrl', base);
    localStorage.setItem('apiToken', token);
  } catch (e) { /* private browsing / storage blocked — just skip persistence */ }
  return { base, token };
}

(function restoreConfig() {
  try {
    const savedUrl = localStorage.getItem('workerUrl');
    const savedToken = localStorage.getItem('apiToken');
    if (savedUrl) document.getElementById('workerUrl').value = savedUrl;
    if (savedToken) document.getElementById('apiToken').value = savedToken;
  } catch (e) { /* ignore */ }
})();

async function api(path, opts = {}) {
  const { base, token } = getConfig();
  if (!base || !token) { showToast('Set your Worker URL and API token first.', 'error'); throw new Error('missing config'); }
  const res = await fetch(base + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// Presigned upload straight to R2 (bypasses the Worker's body size limit).
// Shared by the media file and the thumbnail; returns { publicUrl, key }.
async function uploadToR2(file, { filename, title, onProgress }) {
  const { base, token } = getConfig();
  // Step 1: ask the Worker for a presigned URL
  const presignRes = await fetch(base + '/upload-url', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ filename, title }),
  });
  const presignData = await presignRes.json();
  if (!presignRes.ok) throw new Error(presignData.error || presignRes.statusText);

  // Step 2: upload the file bytes straight to R2, bypassing the Worker
  await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', presignData.uploadUrl);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => (xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error('R2 upload failed: ' + xhr.status)));
    xhr.onerror = () => reject(new Error('Network error during upload'));
    xhr.send(file);
  });
  return presignData;
}

async function uploadFile(file) {
  const { base, token } = getConfig();
  if (!base || !token) { showToast('Set your Worker URL and API token first.', 'error'); return; }
  const statusEl = document.getElementById('uploadStatus');
  const sizeLabel = `${(file.size / 1024 / 1024).toFixed(1)} MB`;
  statusEl.textContent = `Uploading 0% (${sizeLabel})...`;

  try {
    const presignData = await uploadToR2(file, {
      filename: file.name,
      title: document.getElementById('caption').value.trim(),
      onProgress: pct => { statusEl.textContent = `Uploading ${pct}% (${sizeLabel})...`; },
    });

    document.getElementById('mediaUrl').value = presignData.publicUrl;
    document.getElementById('mediaType').value = file.type.startsWith('video') ? 'video' : 'image';
    // Frame picking reads this local copy instead of re-downloading the video.
    localVideo = file.type.startsWith('video') ? { file, url: presignData.publicUrl } : null;
    onMediaChanged();
    statusEl.textContent = 'Uploaded ✓ ' + presignData.key;
    showToast('File uploaded.', 'success');
    loadMedia();
  } catch (e) {
    statusEl.textContent = '';
    showToast('Upload failed: ' + e.message, 'error');
  }
}

// ---- Optional custom thumbnail ---------------------------------------------
// Stored with the post as extra_json.thumbnail_url (+ thumbnail_time_ms when
// it was captured from a frame, so TikTok can use that same frame as its
// cover). Only offered for video posts.
let thumbnail = null;   // { url, timeMs|null, previewUrl, label }
let localVideo = null;  // { file, url } — the video just uploaded from this browser
let thumbnailUploading = false;

function onMediaChanged() {
  // Any change to the video makes an existing thumbnail stale.
  clearThumbnail();
  closeFramePicker();
  const isVideo = document.getElementById('mediaType').value === 'video'
    && document.getElementById('mediaUrl').value.trim();
  document.getElementById('thumbnailField').style.display = isVideo ? 'block' : 'none';
}

function setThumbStatus(text) {
  document.getElementById('thumbStatus').textContent = text || '';
}

function showThumbnail(t) {
  thumbnail = t;
  document.getElementById('thumbImg').src = t.previewUrl;
  document.getElementById('thumbSource').textContent = t.label;
  document.getElementById('thumbPreview').style.display = 'block';
  document.getElementById('thumbOptions').style.display = 'none';
}

function clearThumbnail() {
  if (thumbnail && thumbnail.previewUrl.startsWith('blob:')) URL.revokeObjectURL(thumbnail.previewUrl);
  thumbnail = null;
  document.getElementById('thumbPreview').style.display = 'none';
  document.getElementById('thumbOptions').style.display = 'flex';
  document.getElementById('thumbFile').value = '';
  setThumbStatus('');
}

function formatClock(seconds) {
  const s = Math.floor(seconds);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function openFramePicker() {
  const mediaUrl = document.getElementById('mediaUrl').value.trim();
  if (!mediaUrl) return;
  const video = document.getElementById('frameVideo');
  const slider = document.getElementById('frameSlider');
  // A canvas can only read frames from a cross-origin video when it's loaded
  // with CORS (the R2 bucket allows GET from any origin).
  if (localVideo && localVideo.url === mediaUrl) {
    video.removeAttribute('crossorigin');
    video.src = URL.createObjectURL(localVideo.file);
  } else {
    video.crossOrigin = 'anonymous';
    // Our own R2 files load through the Worker: some networks' DNS can't
    // resolve the r2.dev domain, but the Worker domain always works here.
    const { base } = getConfig();
    const r2 = mediaUrl.match(/^https:\/\/[^/]+\.r2\.dev\/(.+)$/);
    video.src = r2 && base ? `${base}/media/${encodeURIComponent(decodeURIComponent(r2[1]))}` : mediaUrl;
  }
  video.onloadedmetadata = () => {
    slider.max = video.duration;
    slider.value = Math.min(1, video.duration / 2);
    video.currentTime = Number(slider.value);
  };
  video.onerror = () => { setThumbStatus('Could not load the video. Upload an image instead.'); closeFramePicker(); };
  slider.oninput = () => {
    video.currentTime = Number(slider.value);
    document.getElementById('frameTime').textContent = formatClock(Number(slider.value));
  };
  document.getElementById('frameTime').textContent = '0:00';
  document.getElementById('framePicker').style.display = 'block';
  document.getElementById('thumbOptions').style.display = 'none';
  setThumbStatus('Slide to pick the frame.');
}

function closeFramePicker() {
  const video = document.getElementById('frameVideo');
  if (video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
  video.removeAttribute('src');
  video.load();
  document.getElementById('framePicker').style.display = 'none';
  if (!thumbnail) document.getElementById('thumbOptions').style.display = 'flex';
}

function canvasToJpeg(canvas, quality) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

async function useCurrentFrame() {
  const video = document.getElementById('frameVideo');
  if (!video.videoWidth) { setThumbStatus('Wait for the video to load first.'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  let blob;
  try {
    // YouTube rejects thumbnails over 2MB, so step the quality down if needed.
    blob = await canvasToJpeg(canvas, 0.9);
    if (blob.size > 2 * 1024 * 1024) blob = await canvasToJpeg(canvas, 0.7);
  } catch (e) {
    setThumbStatus('Could not capture a frame from this video. Upload an image instead.');
    return;
  }
  const timeMs = Math.round(video.currentTime * 1000);
  closeFramePicker();
  await uploadThumbnail(blob, 'frame.jpg', timeMs, `Frame at ${formatClock(timeMs / 1000)}`);
}

async function uploadThumbnail(blob, filename, timeMs, label) {
  const { base, token } = getConfig();
  if (!base || !token) { showToast('Set your Worker URL and API token first.', 'error'); return; }
  document.getElementById('thumbOptions').style.display = 'none';
  setThumbStatus('Uploading thumbnail...');
  thumbnailUploading = true;
  try {
    const caption = document.getElementById('caption').value.trim();
    const presignData = await uploadToR2(blob, { filename, title: `${caption} thumbnail`.trim() });
    showThumbnail({ url: presignData.publicUrl, timeMs, previewUrl: URL.createObjectURL(blob), label });
    setThumbStatus(blob.size > 2 * 1024 * 1024 ? 'This is over 2MB, so YouTube will keep its default thumbnail.' : '');
  } catch (e) {
    clearThumbnail();
    showToast('Thumbnail upload failed: ' + e.message, 'error');
  } finally {
    thumbnailUploading = false;
  }
}

document.getElementById('thumbFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) uploadThumbnail(file, file.name, null, 'Custom image');
});
document.getElementById('mediaType').addEventListener('change', onMediaChanged);
document.getElementById('mediaUrl').addEventListener('change', () => { localVideo = null; onMediaChanged(); });

document.getElementById('mediaFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) uploadFile(file);
});

async function connect(platform) {
  const { base, token } = getConfig();
  if (!base || !token) { showToast('Set your Worker URL and API token first.', 'error'); return; }
  // Tab is opened first (inside the click) so the popup blocker allows it,
  // then pointed at the authorize URL fetched with the token in a header.
  const tab = window.open('', '_blank');
  let target;
  try {
    target = (await api(`/auth/${platform}/start?json=1`)).url;
  } catch (e) { /* older Worker without ?json=1 — fall through */ }
  // Fallback keeps the old behaviour (token in the URL).
  target = target || `${base}/auth/${platform}/start?token=${encodeURIComponent(token)}`;
  if (tab) tab.location = target; else window.location = target;
}

async function loadAccounts() {
  try {
    const data = await api('/accounts');
    accounts = data.accounts || [];
    const platformsConnected = new Set(accounts.map(a => a.platform));
    ['facebook', 'youtube', 'tiktok'].forEach(p => {
      document.getElementById('dot-' + p).classList.toggle('live', platformsConnected.has(p));
    });
    const sel = document.getElementById('accountChecklist');
    sel.innerHTML = accounts.length
      ? accounts.map(a => `
          <div class="checklist-row">
            <input type="checkbox" id="acc-${a.id}" value="${a.id}">
            <label for="acc-${a.id}">${a.platform.toUpperCase()} — ${escapeHtml(a.account_name)}</label>
          </div>
        `).join('')
      : '<div class="media-empty">— connect an account first —</div>';
  } catch (e) {
    // api() already toasts when config is missing; anything else (wrong
    // token, Worker down) used to fail silently and leave a blank page.
    if (e.message !== 'missing config') showToast('Could not connect to the Worker: ' + e.message, 'error');
  }
}

async function loadPosts() {
  try {
    const data = await api('/posts');
    posts = data.posts || [];
    renderQueue();
  } catch (e) { /* ignore until configured */ }
}

function renderQueue() {
  const container = document.getElementById('queueContainer');

  const postedCount = posts.filter(p => p.status === 'posted').length;
  const failedCount = posts.filter(p => p.status === 'failed').length;
  const queueCount = posts.length - postedCount - failedCount;
  document.getElementById('count-queue').textContent = posts.length ? queueCount : '';
  document.getElementById('count-failed').textContent = posts.length ? failedCount : '';
  document.getElementById('count-posted').textContent = posts.length ? postedCount : '';
  document.getElementById('clearAllFailedBtn').style.display =
    (activeTab === 'failed' && failedCount > 0) ? 'block' : 'none';

  const visible = posts.filter(p => {
    if (activeTab === 'posted') return p.status === 'posted';
    if (activeTab === 'failed') return p.status === 'failed';
    return p.status !== 'posted' && p.status !== 'failed';
  });

  if (!visible.length) {
    const emptyMsg = {
      posted: 'Nothing posted yet.',
      failed: 'No failed posts. 🎉',
      queue: 'No posts queued yet. Schedule one on the left.',
    }[activeTab];
    container.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  const groups = {};
  visible.forEach(p => {
    const d = new Date(p.scheduled_time * 1000);
    const key = d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    (groups[key] = groups[key] || []).push(p);
  });

  container.innerHTML = Object.entries(groups).map(([day, items]) => `
    <div class="day-group">
      <div class="day-label">${day}</div>
      ${items.map(renderTicket).join('')}
    </div>
  `).join('');
}

// Direct link to the live post, shown on successful posts so it's easy to
// check "goods ba to?" without hunting for it manually.
function buildPlatformLink(p) {
  // Zernio-routed posts (TikTok, and some Facebook Reels — see
  // platforms/zernio.js) carry the real platform URL in platform_post_url
  // once Zernio resolves it. TikTok resolves its URL asynchronously, so
  // this can be missing even on a genuinely successful post — falls
  // through to the "no direct link yet" note in that case.
  if (p.platform_post_url) return p.platform_post_url;
  if (!p.platform_post_id) return null;
  if (p.account_provider === 'zernio') return null;
  if (p.platform === 'facebook') {
    // /videos-endpoint posts return a bare video ID; /feed and /photos
    // return "{page_id}_{post_id}" which facebook.com/{that} resolves fine.
    return p.media_type === 'video'
      ? `https://www.facebook.com/watch/?v=${p.platform_post_id}`
      : `https://www.facebook.com/${p.platform_post_id}`;
  }
  if (p.platform === 'youtube') {
    return `https://www.youtube.com/watch?v=${p.platform_post_id}`;
  }
  return null;
}

function renderTicket(p) {
  const d = new Date(p.scheduled_time * 1000);
  const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  const statusClass = 'status-' + p.status;
  const statusLabel = p.status === 'fb_reel_processing' ? 'processing reel' : p.status;
  const retryBtn = p.status === 'failed'
    ? `<button class="cancel-btn retry-btn" onclick="retryPost(${p.id})">Retry</button>` : '';
  const rescheduleBtn = isReschedulable(p)
    ? `<button class="cancel-btn retry-btn" onclick="openReschedule(${p.id})">Reschedule</button>` : '';
  const cancelBtn = p.status === 'posted'
    ? ''
    : retryBtn + rescheduleBtn + `<button class="cancel-btn" onclick="removePost(${p.id})">${p.status === 'failed' ? 'Clear' : 'Cancel'}</button>`;
  const progressLabel = p.status === 'uploading' && p.yt_total_bytes
    ? ` ${Math.round((p.yt_bytes_uploaded / p.yt_total_bytes) * 100)}%`
    : p.status === 'fb_reel_processing'
    ? ` ${Math.min(100, Math.round(((p.attempts || 0) / FB_REEL_MAX_TICKS) * 100))}%`
    : '';
  // Posts auto-retrying a transient error (see ZernioRetryableError in
  // src/platforms/zernio.js) stay 'pending' with the error noted, so the
  // operator can tell "waiting for its normal time" apart from "waiting
  // because a previous attempt hit a capacity error and got pushed back."
  const isRetryNote = p.status === 'pending' && (p.attempts || 0) > 0 && p.error_message;
  const errorLine = (p.status === 'failed' || isRetryNote) && p.error_message
    ? `<div class="ticket-error"${isRetryNote ? ' style="color:var(--warning)"' : ''}><svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>${escapeHtml(p.error_message)}</span></div>` : '';
  // Shows what the operator actually picked, since the visible ticket time
  // above now reflects the pushed-forward retry attempt, not the original.
  const origTimeLine = isRetryNote && p.original_scheduled_time
    ? `<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Orig. schedule: ${new Date(p.original_scheduled_time * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>`
    : '';
  const platformLink = buildPlatformLink(p);
  const viewLink = p.status !== 'posted'
    ? ''
    : platformLink
    ? `<a class="ticket-view-link" href="${platformLink}" target="_blank" rel="noopener">View post <svg class="icon" style="width:12px;height:12px;display:inline;vertical-align:-1px" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`
    : p.account_provider === 'zernio'
    ? `<div class="ticket-view-link" style="opacity:0.6">Posted via Zernio — no direct link, verify on zernio.com</div>`
    : '';
  return `
    <div class="ticket">
      <div class="ticket-body">
        <div class="ticket-time">${time}</div>
        <div class="ticket-main">
          <div class="ticket-platform ${p.platform}">${p.platform}${p.account_name ? ` <span class="ticket-account">— ${escapeHtml(p.account_name)}</span>` : ''}</div>
          <div class="ticket-caption">${escapeHtml(p.caption || '(no caption)')}</div>
          ${errorLine}
          ${origTimeLine}
          ${hasCustomThumbnail(p) ? '<div class="ticket-thumb-note">Custom thumbnail</div>' : ''}
          ${viewLink}
          ${p.id === reschedulingId ? renderRescheduleRow(p) : ''}
        </div>
        <div class="status-badge ${statusClass}"><span class="led"></span>${statusLabel}${progressLabel}</div>
        ${cancelBtn}
      </div>
    </div>
  `;
}

document.getElementById('postNow').addEventListener('change', (e) => {
  const row = document.getElementById('dateTimeRow');
  row.style.display = e.target.checked ? 'none' : 'flex';
});

const TAMMY_PADAL_ACCOUNT_ID = 77; // accounts.id of the Tammy Padal FB page

async function schedulePost() {
  const checked = Array.from(document.querySelectorAll('#accountChecklist input[type="checkbox"]:checked'));
  const accountIds = checked.map(c => Number(c.value));
  const caption = document.getElementById('caption').value;
  const mediaUrl = document.getElementById('mediaUrl').value;
  const mediaType = document.getElementById('mediaType').value;
  const postNow = document.getElementById('postNow').checked;
  const date = document.getElementById('postDate').value;
  const time = document.getElementById('postTime').value;

  if (!accountIds.length) { showToast('Pick at least one account.', 'error'); return; }
  if (thumbnailUploading) { showToast('Wait for the thumbnail upload to finish.', 'error'); return; }

  // YouTube always requires a video — block scheduling without one instead of
  // letting it queue up and fail later with a confusing "Invalid URL" error.
  const selectedAccounts = accounts.filter(a => accountIds.includes(a.id));
  const missingVideoForYoutube = selectedAccounts.some(a => a.platform === 'youtube') && (!mediaUrl || mediaType !== 'video');
  if (missingVideoForYoutube) {
    showToast('A YouTube post needs a video file. Upload one or pick "Use" in the Media library.', 'error');
    return;
  }

  let scheduledTime;
  if (postNow) {
    scheduledTime = Math.floor(Date.now() / 1000);
  } else {
    if (!date || !time) { showToast('Set a date and time.', 'error'); return; }
    scheduledTime = Math.floor(new Date(`${date}T${time}`).getTime() / 1000);
    if (scheduledTime <= Math.floor(Date.now() / 1000)
        && !confirm('That time has already passed, so this will post right away. Continue?')) return;
  }

  // Tammy Padal's page goes out 1 hour after the EasyPC pages when both are
  // in the same batch; Reschedule on the post still overrides it by hand.
  const withEasyPc = selectedAccounts.some(a => a.id !== TAMMY_PADAL_ACCOUNT_ID && /easy\s?pc/i.test(a.account_name));
  const timeFor = id => (withEasyPc && id === TAMMY_PADAL_ACCOUNT_ID ? scheduledTime + 3600 : scheduledTime);

  let successCount = 0;
  const errors = [];
  // Disabled while sending so a double click can't queue the same post twice.
  const submitBtn = document.querySelector('.submit-btn');
  submitBtn.disabled = true;

  for (const box of checked) {
    const accountId = Number(box.value);
    try {
      await api('/posts', {
        method: 'POST',
        body: JSON.stringify({
          account_id: accountId,
          caption,
          media_url: mediaUrl || null,
          media_type: mediaType,
          scheduled_time: timeFor(accountId),
          extra_json: thumbnail && mediaType === 'video'
            ? { thumbnail_url: thumbnail.url, ...(thumbnail.timeMs !== null ? { thumbnail_time_ms: thumbnail.timeMs } : {}) }
            : undefined,
        }),
      });
      successCount++;
      box.checked = false;
    } catch (e) {
      errors.push(e.message);
    }
  }
  submitBtn.disabled = false;

  if (successCount) showToast(`Added to queue (${successCount} account${successCount > 1 ? 's' : ''}).`, 'success');
  if (successCount && withEasyPc && accountIds.includes(TAMMY_PADAL_ACCOUNT_ID)) showToast('Tammy Padal is set 1 hour after the EasyPC pages.', 'success');
  if (errors.length) showToast(`${errors.length} failed: ${errors[0]}`, 'error');

  if (postNow && successCount) {
    try { await api('/run-now', { method: 'POST' }); } catch (e) { /* cron will pick it up anyway */ }
  }

  // Keep the form (and the failed accounts still ticked) when something
  // failed, so the caption isn't lost and a retry is one click.
  if (!errors.length) {
    document.getElementById('caption').value = '';
    document.getElementById('mediaUrl').value = '';
    document.getElementById('mediaFile').value = '';
    document.getElementById('uploadStatus').textContent = '';
    localVideo = null;
    onMediaChanged();
  }
  loadPosts();
}

async function retryPost(id) {
  try {
    await api(`/posts/${id}/retry`, { method: 'POST' });
    showToast('Back in the queue — goes out within a minute.', 'success');
    loadPosts();
  } catch (e) { showToast(e.message, 'error'); }
}

// Inline date/time editor on a ticket. Only one open at a time; the id is
// kept across renderQueue() so a loadPosts() refresh doesn't close it.
let reschedulingId = null;

function toLocalInputs(ts) {
  const d = new Date(ts * 1000);
  const pad = n => String(n).padStart(2, '0');
  return {
    date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
    time: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
  };
}

function renderRescheduleRow(p) {
  // A failed post's old time is usually already past, so default to the
  // next full hour instead of a time that would fire immediately.
  const nowTs = Math.floor(Date.now() / 1000);
  const startTs = p.scheduled_time > nowTs ? p.scheduled_time : Math.ceil(nowTs / 3600) * 3600;
  const v = toLocalInputs(startTs);
  // Same post scheduled on several pages = several rows with identical
  // caption + media. Offer to move them together; pre-check only the ones
  // from the same batch (same time), so deliberately staggered copies
  // aren't pulled along unless the operator ticks them.
  const siblings = findSameContent(p);
  const siblingList = siblings.length ? `
    <div class="reschedule-siblings">
      <div class="reschedule-siblings-title">Also move ${siblings.length} other post(s) with the same content:</div>
      ${siblings.map(s => `
        <div class="checklist-row">
          <input type="checkbox" id="rsSib-${s.id}" value="${s.id}" ${s.scheduled_time === p.scheduled_time ? 'checked' : ''}>
          <label for="rsSib-${s.id}">${escapeHtml(s.account_name || s.platform)} · ${new Date(s.scheduled_time * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}${s.status === 'failed' ? ' (failed)' : ''}</label>
        </div>`).join('')}
    </div>` : '';
  return `
    <div class="reschedule-row">
      <div class="field"><label for="rsDate-${p.id}">New date</label><input id="rsDate-${p.id}" type="date" value="${v.date}"></div>
      <div class="field"><label for="rsTime-${p.id}">New time</label><input id="rsTime-${p.id}" type="time" value="${v.time}"></div>
      <button class="cancel-btn retry-btn" onclick="saveReschedule(${p.id})">Save</button>
      <button class="cancel-btn" onclick="closeReschedule()">Cancel</button>
      ${siblingList}
    </div>
  `;
}

function hasCustomThumbnail(p) {
  try { return !!(p.extra_json && JSON.parse(p.extra_json).thumbnail_url); } catch (e) { return false; }
}

function isReschedulable(p) {
  return p.status === 'pending' || p.status === 'failed';
}

function findSameContent(p) {
  // Posts with no caption and no media would all "match" each other, so
  // those never count as same content.
  if (!p.caption && !p.media_url) return [];
  return posts.filter(q => q.id !== p.id && isReschedulable(q)
    && (q.caption || '') === (p.caption || '') && (q.media_url || '') === (p.media_url || ''))
    .sort((a, b) => a.scheduled_time - b.scheduled_time);
}

function openReschedule(id) {
  reschedulingId = id;
  renderQueue();
  const input = document.getElementById(`rsDate-${id}`);
  if (input) input.focus();
}

function closeReschedule() {
  reschedulingId = null;
  renderQueue();
}

async function saveReschedule(id) {
  const date = document.getElementById(`rsDate-${id}`).value;
  const time = document.getElementById(`rsTime-${id}`).value;
  if (!date || !time) { showToast('Set a date and time.', 'error'); return; }
  const scheduledTime = Math.floor(new Date(`${date}T${time}`).getTime() / 1000);
  if (scheduledTime <= Math.floor(Date.now() / 1000)
      && !confirm('That time has already passed, so this will post right away. Continue?')) return;
  const ids = [id, ...Array.from(document.querySelectorAll('.reschedule-siblings input:checked')).map(c => Number(c.value))];
  try {
    const result = await api('/posts/reschedule', {
      method: 'POST',
      body: JSON.stringify({ ids, scheduled_time: scheduledTime }),
    });
    reschedulingId = null;
    const label = new Date(scheduledTime * 1000).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    if (!result.updated) {
      showToast('Not moved. It may have already started posting.', 'error');
    } else if (result.updated < result.requested) {
      showToast(`${result.updated} of ${result.requested} posts moved to ${label}. The rest already started posting.`, 'error');
    } else {
      showToast(result.updated > 1 ? `Moved ${result.updated} posts to ${label}.` : `Moved to ${label}.`, 'success');
    }
    loadPosts();
  } catch (e) { showToast(e.message, 'error'); }
}

async function removePost(id) {
  if (!confirm('Remove this post? This cannot be undone.')) return;
  try {
    await api(`/posts/${id}`, { method: 'DELETE' });
    showToast('Removed.', 'success');
    loadPosts();
  } catch (e) { showToast(e.message, 'error'); }
}

async function clearAllFailed() {
  const failedCount = posts.filter(p => p.status === 'failed').length;
  if (!failedCount) return;
  if (!confirm(`Clear all ${failedCount} failed post(s)? This can't be undone.`)) return;
  try {
    const result = await api('/posts?status=failed', { method: 'DELETE' });
    showToast(`Cleared ${result.deleted} failed post(s).`, 'success');
    loadPosts();
  } catch (e) { showToast(e.message, 'error'); }
}

function loadAll() { loadAccounts(); loadPosts(); loadMedia(); }

async function loadMedia() {
  try {
    const data = await api('/media');
    renderMediaLibrary(data.files || []);
  } catch (e) { /* ignore until configured */ }
}

function renderMediaLibrary(files) {
  renderStorageMeter(files);
  const el = document.getElementById('mediaLibrary');
  if (!files.length) { el.innerHTML = '<div class="media-empty">No uploads yet.</div>'; return; }
  el.innerHTML = files.map(f => `
    <div class="media-row">
      <div style="flex:1;min-width:0;">
        <div class="media-name" title="${escapeHtml(f.key)}">${escapeHtml(f.key)}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${formatUploadDate(f.uploaded)}</div>
      </div>
      <div class="media-size">${formatBytes(f.size)}</div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="cancel-btn" onclick="useMedia('${escapeHtml(f.url)}', '${escapeHtml(f.key)}')">Use</button>
        <button class="cancel-btn" onclick="downloadMedia('${escapeHtml(f.key)}')">Download</button>
        <button class="cancel-btn" onclick="deleteMedia('${escapeHtml(f.key)}')">Delete</button>
      </div>
    </div>
  `).join('');
}

function renderStorageMeter(files) {
  const totalBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
  const pct = Math.min(100, (totalBytes / STORAGE_LIMIT_BYTES) * 100);
  const level = pct >= 95 ? 'crit' : pct >= 80 ? 'warn' : 'ok';

  const el = document.getElementById('storageMeter');
  const banner = level !== 'ok'
    ? `<div class="storage-banner ${level === 'crit' ? 'crit' : ''}">
        <svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        ${level === 'crit' ? 'Storage is almost full!' : 'Storage is filling up.'}
        Delete files you no longer need.
      </div>`
    : '';

  el.innerHTML = `
    ${banner}
    <div class="storage-meter">
      <div class="storage-meter-top">
        <span class="storage-meter-label">${formatBytes(totalBytes)} / ${formatBytes(STORAGE_LIMIT_BYTES)} used</span>
        <span class="storage-meter-label">${pct.toFixed(1)}%</span>
      </div>
      <div class="storage-meter-track">
        <div class="storage-meter-fill ${level === 'crit' ? 'crit' : level === 'warn' ? 'warn' : ''}" style="width:${pct}%;"></div>
      </div>
    </div>
  `;

  if (level !== 'ok' && !storageWarned) {
    storageWarned = true;
    showToast(
      level === 'crit' ? 'Storage is almost full! Delete some files.' : 'Storage is filling up. Check the media library.',
      level === 'crit' ? 'error' : ''
    );
  }
  if (level === 'ok') storageWarned = false;
}

function formatUploadDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
    ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function useMedia(url, key) {
  document.getElementById('mediaUrl').value = url;
  const ext = key.split('.').pop().toLowerCase();
  const videoExts = ['mp4', 'mov', 'avi', 'webm', 'mkv'];
  document.getElementById('mediaType').value = videoExts.includes(ext) ? 'video' : 'image';
  localVideo = null;
  onMediaChanged();
  showToast('Media URL filled in.', 'success');
}

// Plain link to the Worker so the browser streams the file into its own
// download bar right away, instead of loading the whole video into memory first.
function downloadMedia(key) {
  const { base } = getConfig();
  if (!base) { showToast('Set your Worker URL first.', 'error'); return; }
  const a = document.createElement('a');
  a.href = `${base}/media/${encodeURIComponent(key)}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  showToast('Download started. Check your browser downloads.', 'success');
}

async function deleteMedia(key, force) {
  const { base, token } = getConfig();
  if (!base || !token) { showToast('Set your Worker URL and API token first.', 'error'); return; }
  if (!force && !confirm(`Delete the file "${key}"? This cannot be undone.`)) return;
  try {
    const res = await fetch(`${base}/media/${encodeURIComponent(key)}${force ? '?force=true' : ''}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token },
    });
    const data = await res.json();
    if (res.status === 409) {
      const list = data.pending_posts.map(p => `#${p.id} (${p.platform})`).join(', ');
      const confirmDelete = confirm(
        `${data.message}\nAffected: ${list}\n\nDeleting anyway will make those posts fail when their time comes. Delete anyway?`
      );
      if (confirmDelete) return deleteMedia(key, true);
      return;
    }
    if (!res.ok) throw new Error(data.error || res.statusText);
    showToast('File deleted.', 'success');
    loadMedia();
  } catch (e) { showToast(e.message, 'error'); }
}

function showToast(msg, type) {
  // One shared stack so a success and an error shown together don't overlap.
  let stack = document.getElementById('toastStack');
  if (!stack) {
    stack = document.createElement('div');
    stack.id = 'toastStack';
    stack.setAttribute('role', 'status');
    document.body.appendChild(stack);
  }
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Handle redirect back from /auth/:platform/callback
(function handleRedirectParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('connected')) {
    showToast(`Connected ${params.get('connected')} (${params.get('count')} account(s)).`, 'success');
  }
  if (params.get('connect_error')) {
    showToast('Connect failed: ' + params.get('connect_error'), 'error');
  }
  if (params.toString()) window.history.replaceState({}, '', window.location.pathname);
})();

// Auto-load since Worker URL and token are already baked in
loadAll();

// Keeps progress ("uploading 45%") and due posts moving without pressing
// Refresh. Skipped while the tab is hidden or the reschedule editor is open
// (a re-render would wipe the date/time being typed).
setInterval(() => {
  if (document.hidden || reschedulingId !== null) return;
  const now = Math.floor(Date.now() / 1000);
  const active = posts.some(p => ['processing', 'uploading', 'fb_reel_processing'].includes(p.status)
    || (p.status === 'pending' && p.scheduled_time <= now));
  if (active) loadPosts();
}, 15000);
</script>
</body>
</html>
